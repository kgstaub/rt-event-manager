<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Staff management front-end">
  <rect width="640" height="420" fill="#f7f8fa"/>
  <rect x="48" y="48" width="544" height="324" rx="16" fill="#ffffff" stroke="#e7e9ec" stroke-width="2"/>
  <text x="72" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#CC0B24">Event Management</text>
