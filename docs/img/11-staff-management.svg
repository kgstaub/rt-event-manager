  <rect x="124" y="127" width="180" height="10" rx="5" fill="#c9ced4"/>
  <!-- roster rows with role badges -->
  <g>
    <rect x="72" y="172" width="496" height="44" rx="10" fill="#fbfbfc" stroke="#eef0f3"/>
