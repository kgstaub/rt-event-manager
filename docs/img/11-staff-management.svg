  </g>
  <g transform="translate(0,112)">
    <rect x="72" y="172" width="496" height="44" rx="10" fill="#fbfbfc" stroke="#eef0f3"/>
    <circle cx="98" cy="194" r="13" fill="#12233d"/>
    <rect x="122" y="188" width="150" height="12" rx="6" fill="#3a4658"/>
