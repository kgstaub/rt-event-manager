  <!-- phone -->
  <rect x="220" y="40" width="200" height="340" rx="28" fill="#12233d"/>
  <rect x="234" y="64" width="172" height="292" rx="14" fill="#0e141b"/>
  <rect x="290" y="50" width="60" height="8" rx="4" fill="#2b3a52"/>
