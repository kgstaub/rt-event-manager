  <rect x="276" y="124" width="26" height="26" fill="#ffffff"/><rect x="338" y="124" width="26" height="26" fill="#ffffff"/><rect x="276" y="186" width="26" height="26" fill="#ffffff"/><rect x="322" y="170" width="18" height="18" fill="#ffffff"/>
