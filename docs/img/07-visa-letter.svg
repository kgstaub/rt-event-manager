<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Visa letter of invitation">
  <rect width="640" height="420" fill="#f7f8fa"/>
  <!-- letter -->
  <rect x="140" y="40" width="300" height="340" rx="12" fill="#ffffff" stroke="#e7e9ec" stroke-width="2"/>
  <circle cx="180" cy="80" r="16" fill="#CC0B24"/>
  <text x="206" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#12233d">Letter of Invitation</text>
  <rect x="170" y="120" width="240" height="10" rx="5" fill="#c9ced4"/>
  <rect x="170" y="142" width="240" height="10" rx="5" fill="#c9ced4"/>
  <rect x="170" y="164" width="180" height="10" rx="5" fill="#c9ced4"/>
  <rect x="170" y="200" width="240" height="8" rx="4" fill="#dfe3e8"/>
  <rect x="170" y="218" width="240" height="8" rx="4" fill="#dfe3e8"/>
  <rect x="170" y="236" width="150" height="8" rx="4" fill="#dfe3e8"/>
  <!-- signature -->
  <path d="M180 300 q20 -20 40 0 t40 0" stroke="#12233d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="170" y="322" width="110" height="8" rx="4" fill="#c9ced4"/>
  <!-- QR verify -->
  <rect x="322" y="286" width="88" height="88" rx="8" fill="#f7f8fa" stroke="#e7e9ec"/>
  <rect x="334" y="298" width="18" height="18" fill="#12233d"/><rect x="382" y="298" width="18" height="18" fill="#12233d"/><rect x="334" y="346" width="18" height="18" fill="#12233d"/><rect x="360" y="326" width="14" height="14" fill="#12233d"/>
  <!-- seal -->
  <circle cx="430" cy="120" r="34" fill="none" stroke="#CC0B24" stroke-width="3" opacity="0.7"/>
  <path d="M414 120 l10 10 l20 -22" stroke="#CC0B24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
